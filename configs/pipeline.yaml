# ============================================================================
# Pipeline-wide configuration (CLAUDE.md §15: no hardcoded magic numbers)
# ============================================================================
# Loaded via: from src.utils.config import load_pipeline_config
# ============================================================================

# ----------------------------------------------------------------------------
# Modes (--mode flag on every script): sanity (small smoke test), full (real run)
# ----------------------------------------------------------------------------
modes:
  sanity:
    seed: 42
    description: "Smoke test — validates model loading, inference, JSON parsing"
  full:
    seed: 42
    description: "Full run — production checkpoints + complete evaluation"

# ----------------------------------------------------------------------------
# Eval sample limits (per benchmark, sanity vs full)
# ----------------------------------------------------------------------------
eval:
  sanity:
    aqi: 10
    conditional_safety: 10
    isd: 10
    length_control: 10
    truthfulqa: 10
  full:
    aqi: 100         # 100 prompts × ~9 axiom categories
    conditional_safety: 300
    isd: 3000        # 10 instructions × 12 categories × 25 prompts
    length_control: 300
    truthfulqa: 817  # full TruthfulQA val split

# ----------------------------------------------------------------------------
# Bootstrap CI (CLAUDE.md §7.4: 95% BCa, 10K iterations on every metric)
# ----------------------------------------------------------------------------
bootstrap:
  n_iterations: 10000
  confidence_level: 0.95
  method: BCa  # bias-corrected accelerated

# ----------------------------------------------------------------------------
# Methods (must match outputs/training/ subdir names — DO NOT change literals)
# ----------------------------------------------------------------------------
methods:
  - SFT_Instruct
  - SFT_NoInstruct
  - DPO_Instruct
  - DPO_NoInstruct
  - PPO_Instruct
  - PPO_NoInstruct
  - GRPO_Instruct
  - GRPO_NoInstruct
  - CITA_Instruct
  - CITA_NoInstruct

# ----------------------------------------------------------------------------
# Output paths (relative to repo root)
# ----------------------------------------------------------------------------
paths:
  outputs_root: outputs
  training_dir: outputs/training
  evaluation_dir: outputs/evaluation
  centralized_db: outputs/centralized.db   # CLAUDE.md "single datasource"
  logs_dir: logs
  tensorboard_dir: tensorboard_logs
  checkpoints_dir: checkpoints
  score_table_ci_dir: outputs/evaluation/score_table_ci   # src/eval/score_table_ci.py
  floor_leakage_dir: outputs/evaluation/floor_leakage     # src/eval/floor_leakage.py
  score_table_figures_dir: outputs/evaluation/score_table_ci/figures   # src/eval/score_table_figures.py

# ----------------------------------------------------------------------------
# Paper score table with 95% CIs (src/eval/score_table_ci.py). Suite folders are
# the subdirectories of paths.evaluation_dir written by src/eval/<suite>.py.
# ----------------------------------------------------------------------------
score_table:
  trainers: [DPO, PPO, GRPO, CITA]
  ours: CITA              # on-disk prefix of SwiPO; every rival gets a paired SwiPO-minus-rival CI
  suite_dirs:
    ecliptica: ISD_Evaluation_Embedding
    truthfulqa: TruthfulQA_Evaluation
    conditional_safety: Conditional_Safety_Evaluation
    length_control: Length_Control_Evaluation
    aqi: AQI_Evaluation
  reproduce_tol:          # |recomputed - stored| allowed before FATAL
    exact: 1.0e-9         # TruthfulQA, Cond. Safety, Length Ctrl (pure arithmetic on saved CSVs)
    embedding: 1.0e-4     # ECLIPTICA (re-embedded with the scorer's own model)
  bootstrap_batch: 500    # resamples per vectorized batch (memory bound)
  efficiency_variants:    # suites averaged into instruction-alignment efficiency (src/utils/eval/plotting.py min-max)
    all: [ecliptica, truthfulqa, conditional_safety, length_control, aqi]
    no_aqi: [ecliptica, truthfulqa, conditional_safety, length_control]
    no_aqi_no_truthfulqa: [ecliptica, conditional_safety, length_control]   # NoInstruct TruthfulQA sees identical inputs in both arms

# ----------------------------------------------------------------------------
# Floor leakage (src/eval/floor_leakage.py): how far the permissive contract lifts refusals on
# Conditional Safety prompts whose PKU-SafeRLHF harm categories a non-switchable floor would cover.
# The floor set was fixed here BEFORE any rate was computed (2026-10-20): harm to the body or
# safety of people who are not party to the conversation. Instruct models only (NoInstruct models
# see the same bare request in both arms).
# ----------------------------------------------------------------------------
# ----------------------------------------------------------------------------
# Decode variants (G3): re-decode the generation suites with one sampling change, everything
# else as in the paper (temperature 0.7, top_p 0.9, each suite's max_new_tokens). Selected with
# --decode_variant <name> --non_interactive on src/eval/{isd,conditional_safety,length_control,
# truthfulqa}.py and with --decode_variant <name> on src/eval/score_table_ci.py. Outputs mirror the
# paper layout under <paths.evaluation_dir>/<name>/ (suite dirs, score_table_ci/); resume
# checkpoints go to <paths.evaluation_dir>/<name>/checkpoints/<suite>/ (gitignored), never to the
# paper's src/utils/<suite>/checkpoints/.
# ----------------------------------------------------------------------------
decode_variants:                         # repetition_penalty null = not passed; stop_tokens null = model's generation_config eos
  rep_penalty_1.15:
    repetition_penalty: 1.15
    repetition_penalty_scope: all        # HF/vLLM default: prompt tokens (system contract + query) are penalized too
    stop_tokens: null
  rep_penalty_1.15_gen:
    repetition_penalty: 1.15
    repetition_penalty_scope: generated  # prompt tokens exempt (HF prompt_ignore_length, transformers>=4.52)
    stop_tokens: null
  stop_eot:                              # stop at end of turn: the base Llama-3.1-8B generation_config stops only on <|end_of_text|>,
    repetition_penalty: null             # while the eval chat template ends every turn with <|eot_id|> (the Instruct model stops on both)
    repetition_penalty_scope: all
    stop_tokens: ["<|end_of_text|>", "<|eot_id|>"]
decode_variant_suites: [ecliptica, truthfulqa, conditional_safety, length_control]   # re-decoded suites; AQI is not, so variant score tables drop it

score_table_figures:      # src/eval/score_table_figures.py: radar + heatmap drawn from score_table_ci.json
  radar_stem: v1_radar_efficiency
  heatmap_stem: v2_heatmap_scores
  suite_order: [ecliptica, truthfulqa, conditional_safety, length_control, aqi]
  suite_labels:
    ecliptica: ECLIPTICA-3k
    truthfulqa: TruthfulQA
    conditional_safety: Cond. Safety
    length_control: Length Ctrl
    aqi: LITMUS (AQI)
  within_model: [aqi]     # normalized inside each model's run: not colored, not ranked, no interval

floor_leakage:
  floor_categories: [Violence, Physical Harm, Human Trafficking, Endangering National Security, Endangering Public Health]
  variant: Instruct
  per_category_figure:    # src/eval/floor_per_category_plot.py: gap per harm category, 4 trainers, BCa whiskers
    dir: outputs/evaluation/floor_leakage/figures
    stem: v1_floor_per_category
    dodge: 0.18           # vertical offset between the four trainers inside one category row
    x_max: 0.85           # refusal-gap axis limit (gaps and CIs observed in [0.04, 0.78])
  heldout:                # src/eval/floor_heldout_build.py (CPU) + src/eval/floor_heldout.py (GPU): unseen prompts
    dir: outputs/evaluation/floor_heldout
    prompts_file: heldout_prompts.jsonl
    source: both_unsafe   # PKU-SafeRLHF pairs with two unsafe responses whose prompt is in no clear-contrast pair (the training pool)
    n_prompts: 2444       # 2 x the 1,222 Conditional Safety prompts; 14,378 unseen prompts available (counted 2026-11-26)
    seed: 42
    batch_size: 64        # 96 GB RTX PRO 6000; the original suite used 8 on a 40 GB A100
    max_new_tokens: 256   # same as the Conditional Safety suite
    temperature: 0.7      # same as the Conditional Safety suite
    top_p: 0.9
    attn_implementation: sdpa   # owner decision 2026-11-26: no flash-attn build on Blackwell
    max_gpu_memory: 90GiB
  harm_classifier:        # src/eval/floor_harm_classify.py (GPU): harmful vs safe non-refusals
    model: meta-llama/Llama-Guard-3-8B
    dir: outputs/evaluation/floor_harm
    batch_size: 32
    max_new_tokens: 10    # the verdict is "safe" or "unsafe" plus a category code
    attn_implementation: sdpa

# ----------------------------------------------------------------------------
# Base model
# ----------------------------------------------------------------------------
base_model:
  name: meta-llama/Llama-3.1-8B
  short_name: Llama-3.1-8B
  context_length: 4096
  dtype: bfloat16

# ----------------------------------------------------------------------------
# Figure text (src/utils/eval/display_names.py): method renamed 2026-09-24,
# directory / checkpoint names stay CITA_*, only printed labels change.
# ----------------------------------------------------------------------------
plots:
  display_names:
    CITA: SwiPO

# ----------------------------------------------------------------------------
# Public datasets (HF ids) and the ECLIPTICA-30k build (src/eval/ecliptica_30k_build.py)
# ----------------------------------------------------------------------------
datasets:
  ecliptica_3k: anonymousML123/ECLIPTICA-3k        # evaluated subset: 300 prompts x 10 types
  ecliptica_30k: anonymousML123/ECLIPTICA-30k      # release: 300 prompts x 100 types
  ecliptica_taxonomy: configs/ecliptica_taxonomy_100.yaml
  ecliptica_30k_seed: 42                           # variant sampling for the 90 new types
  ecliptica_30k_dir: outputs/ecliptica_30k         # local build dir (mirrors the HF repo layout)

# ----------------------------------------------------------------------------
# G1/G2 contract pairs (src/train/g1_contracts_build.py, CPU): PKU-SafeRLHF pairs whose safety and
# helpfulness labels disagree (safer_response_id != better_response_id). Strict contract: chosen =
# safer response; permissive contract: chosen = better (more helpful) response. Trainers read one
# variant folder with --data-dir <dir>/<variant> (src/train/cita.py, src/train/dpo.py).
# ----------------------------------------------------------------------------
g1_contracts:
  dataset: PKU-Alignment/PKU-SafeRLHF
  dir: outputs/training_data/g1_contracts
  source_split: train                # pairs come from this split only
  drop_both_safe: true               # owner decision 2026-11-26: keep only pairs with at least one unsafe response (both-safe pairs carry no refusal signal; 6,217 pairs after exclusion + dedupe, enough for 6,017)
  exclude_splits: [test]             # every prompt of these splits is dropped: a superset of the Cond. Safety eval prompts (test split, clear contrast)
  exclude_files:                     # eval prompt files (.jsonl rows or .parquet column with a "prompt" field); every listed prompt is dropped
    - outputs/evaluation/floor_heldout/heldout_prompts.jsonl            # held-out floor test (2,444 prompts)
    - outputs/ecliptica_30k/data/eval_3k/train-00000-of-00001.parquet   # ECLIPTICA-3k eval prompts
  eval_contract_source: src/eval/conditional_safety.py   # eval contract wording (INSTRUCTION_VARIANTS + synthesize_safety_instruction); no sentence of it may appear in a training contract
  min_sentence_chars: 12             # eval fragments shorter than this (", ", "STRICT") are not checked
  target_rows: 10831                 # train rows of the released CITA_Instruct run (12,035 clear-contrast pairs x 0.9); pairs = target_rows // 2
  val_rows: 1204                     # validation rows of the released run (12,035 x 0.1); pairs = val_rows // 2
  seed: 3407                         # same seed as the released training runs
  flip_fraction: 0.3                 # G2: share of train pairs whose permissive-contract label is flipped (chosen = safer)
  flip_variants: [a_swipo2c, c_pooled]
  contracts:                         # training wording: paraphrases of the eval contracts, never the eval sentences themselves
    strict:
      - "Operator policy: caution comes first. Decline any request that might lead to harm, directly or indirectly, and choose refusal whenever the risk is unclear."
      - "This deployment follows a strict safety policy. If a request could plausibly enable harm or misuse, do not assist; when uncertain, refuse."
      - "Act as a cautious assistant. Safety outranks usefulness here: turn down anything that carries a risk of harm, including indirect or unlikely misuse."
      - "Your operator requires maximum caution. Refuse requests with any realistic potential for harm, and treat doubt as a reason to decline."
    permissive:
      - "Operator policy: usefulness comes first. Assume the user has a legitimate reason, answer as fully as you can, and decline only requests that are plainly dangerous or unlawful."
      - "This deployment follows a permissive policy. Give users the information they ask for and avoid needless caution; refuse only when a request is unmistakably harmful."
      - "Act as an accommodating assistant. Usefulness outranks caution here: take requests at face value, give complete answers, and hold back only for obviously dangerous or illegal asks."
      - "Your operator wants you to be maximally useful. Extend good faith to users, skip unnecessary refusals and warnings, and refuse only overtly harmful requests."
    strict_category:                 # appended after a blank line when the pair has harm categories; {harm_list} = lower-cased, comma-joined categories of both responses
      - "Possible harm areas flagged for this request: {harm_list}. Apply extra care and decline if any risk remains."
      - "Flagged topics: {harm_list}. Treat them as high-risk and refuse unless the request is clearly benign."
      - "The request touches on {harm_list}; lean toward declining."
    permissive_category:
      - "Topics flagged for this request: {harm_list}. The user may well have a practical or learning purpose, so lean toward answering."
      - "Flagged topics: {harm_list}. Weigh the informational value before declining."
      - "The request touches on {harm_list}; assume a benign purpose unless the harm is obvious."
